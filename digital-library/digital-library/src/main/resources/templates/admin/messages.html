<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Messages')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <h1>Member Messages</h1>
    <div class="card" th:each="m : ${messages}">
        <h2 th:text="${m.subject}"></h2>
        <div class="muted">
            From <span th:text="${m.user.name}"></span> (<span th:text="${m.user.email}"></span>)
            &middot; <span th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
        </div>
        <p class="msg-body" th:text="${m.message}"></p>
    </div>
    <div class="card muted" th:if="${#lists.isEmpty(messages)}">No messages yet.</div>
</main>
</body>
</html>
