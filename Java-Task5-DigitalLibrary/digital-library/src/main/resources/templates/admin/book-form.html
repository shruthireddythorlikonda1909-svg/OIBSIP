<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Book Form')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: flash}"></div>
    <h1 th:text="${book.id == null} ? 'Add New Book' : 'Edit Book'">Book</h1>
    <form class="card form-narrow" th:action="@{/admin/books}" method="post">
        <input type="hidden" name="id" th:if="${book.id != null}" th:value="${book.id}">
        <label>Title</label>
        <input type="text" name="title" th:value="${book.title}" required>
        <label>Author</label>
        <input type="text" name="author" th:value="${book.author}" required>
        <label>ISBN</label>
        <input type="text" name="isbn" th:value="${book.isbn}" required>
        <label>Category</label>
        <input type="text" name="category" th:value="${book.category}" required placeholder="e.g. Programming, Fiction">
        <label>Quantity (total copies)</label>
        <input type="number" name="quantity" th:value="${book.totalQuantity}" min="0" required>
        <p>
            <button class="btn" type="submit">Save</button>
            <a class="btn sec" th:href="@{/admin/books}">Cancel</a>
        </p>
    </form>
</main>
</body>
</html>
